[build]
publish = ".vitepress/dist"

[[headers]]
for = "/rss.xml"

[headers.values]
Content-Type = "application/xml; charset=utf-8"
X-Content-Type-Options = "nosniff"

[[headers]]
for = "/*/rss.xml"

[headers.values]
Content-Type = "application/xml; charset=utf-8"
X-Content-Type-Options = "nosniff"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
